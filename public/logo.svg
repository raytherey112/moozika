<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="headphoneGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2563eb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e40af;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Left ear cup (part of O) -->
  <circle cx="60" cy="100" r="30" fill="none" stroke="url(#headphoneGradient)" stroke-width="12"/>

  <!-- Right ear cup (part of O) -->
  <circle cx="140" cy="100" r="30" fill="none" stroke="url(#headphoneGradient)" stroke-width="12"/>

  <!-- Top band connecting the two ears -->
  <path d="M 60 70 Q 100 50 140 70" fill="none" stroke="url(#headphoneGradient)" stroke-width="12" stroke-linecap="round"/>

  <!-- Bottom band completing the O shape -->
  <path d="M 60 130 Q 100 150 140 130" fill="none" stroke="url(#headphoneGradient)" stroke-width="12" stroke-linecap="round"/>
</svg>